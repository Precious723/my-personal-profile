<!DOCTYPE html>
<html>

<head>
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">

    <!-- EmailJS -->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: "A5QSezqq_F9nsV9z-"
            });
        })();
    </script>
</head>

<body>

    <h1>Contact Me</h1>

    <nav>
    <a class="nav-link" href="index.html">Home</a> |
    <a class="nav-link" href="about.html">About Me</a> |
    <a class="nav-link" href="hobbies.html">Hobbies</a> |
    <a class="nav-link" href="favorites.html">Favorites</a> |
    <a class="nav-link" href="goals.html">Goals</a> |
    <a class="nav-link" href="contact.html">Contact Me</a>
</nav>
    <hr>

    <section id="contact-section">

    <h2>Send Me a Message</h2>

    <form id="contact-form">

        <label class="form-label">Full Name:</label>
        <input class="form-input" type="text" name="fullname" required>
        <br><br>

        <label class="form-label">Email Address:</label>
        <input class="form-input" type="email" name="email" required>
        <br><br>

        <label class="form-label">Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

       <label class="form-label">Interests:</label>
        <input type="checkbox" name="interests" value="Technology"> Technology
        <input type="checkbox" name="interests" value="Gaming"> Gaming
        <input type="checkbox" name="interests" value="Music"> Music
        <br><br>

        <label class="form-label">Purpose of Visit:</label>
        <select name="purpose">
            <option>General Inquiry</option>
            <option>Feedback</option>
            <option>Collaboration</option>
            <option>School Project</option>
        </select>
        <br><br>

        <label class="form-label">Message:</label>
        <textarea class="form-input" name="message" rows="5" cols="40" required></textarea>
        <br><br>

            <input class="btn primary" type="submit" value="Send Message">
    <input class="btn" type="reset" value="Clear Form">

    </form>

</section>

    </form>

    <script type="text/javascript">
        document.getElementById("contact-form").addEventListener("submit", function (event) {
            event.preventDefault();

            emailjs.sendForm(
                "service_aspu7a9",
                "template_eodk1ad",
                this
            ).then(
                function () {
                    alert("Your message has been sent successfully!");
                    document.getElementById("contact-form").reset();
                },
                function (error) {
                    alert("Sorry, your message could not be sent.");
                    console.log("FAILED...", error);
                }
            );
        });
    </script>

</body>

</html>
