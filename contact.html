<!DOCTYPE html>
<html>

<head>
    <title>Contact Me</title>

    <!-- EmailJS -->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: "A5QSezqq_F9nsV9z-"
            });
        })();
    </script>
</head>

<body>

    <h1>Contact Me</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About Me</a> |
        <a href="hobbies.html">Hobbies</a> |
        <a href="favorites.html">Favorites</a> |
        <a href="goals.html">Goals</a> |
        <a href="contact.html">Contact Me</a>
    </nav>

    <hr>

    <h2>Send Me a Message</h2>

    <form id="contact-form">

        <label>Full Name:</label><br>
        <input type="text" name="fullname" required>
        <br><br>

        <label>Email Address:</label><br>
        <input type="email" name="email" required>
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Interests:</label><br>
        <input type="checkbox" name="interests" value="Technology"> Technology
        <input type="checkbox" name="interests" value="Gaming"> Gaming
        <input type="checkbox" name="interests" value="Music"> Music
        <br><br>

        <label>Purpose of Visit:</label><br>
        <select name="purpose">
            <option>General Inquiry</option>
            <option>Feedback</option>
            <option>Collaboration</option>
            <option>School Project</option>
        </select>
        <br><br>

        <label>Message:</label><br>
        <textarea name="message" rows="5" cols="40" required></textarea>
        <br><br>

        <input type="submit" value="Send Message">
        <input type="reset" value="Clear Form">

    </form>

    <script type="text/javascript">
        document.getElementById("contact-form").addEventListener("submit", function (event) {
            event.preventDefault();

            emailjs.sendForm(
                "service_aspu7a9",
                "template_eodk1ad",
                this
            ).then(
                function () {
                    alert("Your message has been sent successfully!");
                    document.getElementById("contact-form").reset();
                },
                function (error) {
                    alert("Sorry, your message could not be sent.");
                    console.log("FAILED...", error);
                }
            );
        });
    </script>

</body>

</html>
